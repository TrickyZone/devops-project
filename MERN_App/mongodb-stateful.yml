---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  labels:
    app: mongodb-stateful
spec:
  clusterIP: None   # <-- headless service for StatefulSet
  selector:
    app: mongodb-stateful
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017