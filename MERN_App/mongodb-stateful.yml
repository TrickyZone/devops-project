apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: mongodc-sts
  annotations:
    description: This is only for the mongodb stateful set
  labels:
    app: mongodb-stateful
spec:
  serviceName: mongo-service   # <-- required
  replicas: 3
  selector:
    matchLabels:
      app: mongodb-stateful
  template:
    metadata:
      labels:
        app: mongodb-stateful
    spec:
      containers:
        - name: mongodb-app
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret   # <-- fixed
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:    
                secretKeyRef:
                  name: mongo-secret   # <-- fixed
                  key: password





