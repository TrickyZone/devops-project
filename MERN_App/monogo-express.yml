---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: mongo-express
  annotations:
    description: This is the mongo-express deployment
  labels: 
    app: mongo-exp
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: mongo-exp
  template:
    metadata:
      labels: 
        app: mongo-exp
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: mongo-service   # must match DB service
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:    
                secretKeyRef:
                  name: mongo-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
spec: 
  selector:
    app: mongo-exp
  type: NodePort   # for external browser access
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30000   # access via NodeIP:30000












